    }).join('')+'</div>';
  });
  $('bd').innerHTML=h;updTc();

}
function formHtml(){

}

    $('ed').onclick=()=>{mode={id:sel};show()};
    if($('rv'))$('rv').onclick=()=>{delete ED[sel];js('tt-edits',ED);build();if(!M[sel])sel=null;render();show()};
    if(sel)todoUI(sel);
  }else{
    const c=Object.values(BD).length&&[...Array(7)].reduce((s,_,i)=>{const d=new Date(cur);d.setDate(d.getDate()+i);return s+(BD[key(d)]||[]).length},0);
    el.innerHTML=`<span class="mu">${c?`この週は ${c} コマ。授業をタップすると詳細・編集ができます。`:'この週に授業はありません。'}</span><div class="acts"><button id="ad">＋授業を追加（補講など）</button></div>`;
  }
  $('ad').onclick=()=>{mode={id:null};show()};

function todoUI(id){
  const box=$('todo'),list=TD[id]||[];
  box.innerHTML=`<div class="th">やること</div><ul>${list.map((x,i)=>`<li><label><input type="checkbox" data-i="${i}" ${x.d?'checked':''}> <span class="${x.d?'dn':''}">${esc(x.t)}</span>${x.u?` <small>${md(x.u)}まで</small>`:''}</label><button data-x="${i}" aria-label="削除">×</button></li>`).join('')}</ul><div class="add"><input type="text" id="ti" placeholder="例：小テスト範囲を復習" maxlength="80"><input type="date" id="td" value="${id.split('_')[0]}"><button id="ta">追加</button></div>`;
  const done=()=>{if(!(TD[id]||[]).length)delete TD[id];save();todoUI(id);render()};
  const add=()=>{const v=$('ti').value.trim();if(!v)return;(TD[id]=TD[id]||[]).push({t:v,d:false,u:$('td').value});done()};
  $('ta').onclick=add;
  $('ti').onkeydown=ev=>{if(ev.key==='Enter')add()};
  box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{TD[id][+c.dataset.i].d=c.checked;done()});
  box.querySelectorAll('li button').forEach(b=>b.onclick=()=>{TD[id].splice(+b.dataset.x,1);done()});
}
let flt='',nsel='';
function allTodos(){const o=[];for(const k in TD){TD[k].forEach((x,i)=>{let sj,src;if(k.startsWith('s_')){sj=k.slice(2);src='科目共通'}else{const e=M[k];if(!e)return;sj=e.sj;src=md(e.d)+' '+(e.sl+1)+'講'}o.push({k,i,x,sj,src})})}return o}
function updTc(){const n=allTodos().filter(o=>!o.x.d).length;$('tc').textContent=n;$('tc').style.display=n?'':'none'}
function grp(o){if(o.x.d)return 5;const u=o.x.u;if(!u)return 4;const w=new Date(),t=key(w);if(u<t)return 0;if(u===t)return 1;w.setDate(w.getDate()+6-((w.getDay()+6)%7));return u<=key(w)?2:3}
const GN=['期限切れ','今日','今週中','来週以降','期限なし','完了'];
function v2(){
  const box=$('v2'),sub=subs().filter(s=>!SP.test(s)),sv=flt||nsel||sub[0]||'';
  const all=allTodos().filter(o=>!flt||o.sj===flt);
  let h=`<div class="chips"><button data-f="" class="${flt?'':'on'}">すべて</button>${sub.map(c=>`<button data-f="${esc(c)}" class="${flt===c?'on':''}">${esc(info(c).s)}</button>`).join('')}</div>`;
  h+=`<div class="add"><input type="text" id="nt" placeholder="科目のやること" maxlength="80"><select id="ns">${sub.map(c=>`<option value="${esc(c)}" ${c===sv?'selected':''}>${esc(info(c).s)}</option>`).join('')}</select><input type="date" id="nd"><button id="na">追加</button></div>`;
  GN.forEach((n,g)=>{
    const it=all.filter(o=>grp(o)===g).sort((a,b)=>(a.x.u||'9').localeCompare(b.x.u||'9'));
    if(!it.length)return;
    h+=`<div class="gh ${g?'':'late'}">${n}<span>${it.length}</span></div><ul>`+it.map(o=>`<li><div class="lt"><label><input type="checkbox" data-k="${esc(o.k)}" data-i="${o.i}" ${o.x.d?'checked':''}> <span class="${o.x.d?'dn':''}">${esc(o.x.t)}</span></label><button data-k="${esc(o.k)}" data-x="${o.i}" aria-label="削除">×</button></div><div class="ls"><span class="chip" style="--h:${info(o.sj).h}">${esc(info(o.sj).s)}</span>${o.src}${o.x.u?' ・ '+md(o.x.u)+'まで':''}</div></li>`).join('')+'</ul>';
  });
  if(!all.length)h+='<div class="det"><span class="mu">やることはありません。上で科目のやることを追加するか、カレンダーの授業から追加できます。</span></div>';
  box.innerHTML=h;
  box.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;v2()});
  $('ns').onchange=e=>{nsel=e.target.value};
  const add=()=>{const v=$('nt').value.trim(),s=$('ns').value;if(!v||!s)return;nsel=s;const k='s_'+s;(TD[k]=TD[k]||[]).push({t:v,d:false,u:$('nd').value});save();v2();updTc()};
  $('na').onclick=add;$('nt').onkeydown=e=>{if(e.key==='Enter')add()};
  box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{TD[c.dataset.k][+c.dataset.i].d=c.checked;save();v2();render()});
  box.querySelectorAll('li button').forEach(b=>b.onclick=()=>{const l=TD[b.dataset.k];l.splice(+b.dataset.x,1);if(!l.length)delete TD[b.dataset.k];save();v2();render()});
}
async function parsePdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;let Y=null;const out=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await(await pdf.getPage(pn)).getTextContent();
    const its=tc.items.map(i=>({x:i.transform[4],y:-i.transform[5],t:i.str.replace(/\s+/g,'')})).filter(i=>i.t);
    if(!Y)for(const i of its){const m=i.t.match(/(20\d\d)時間割/);if(m){Y=+m[1];break}}
    const hd={};for(const i of its){const m=i.t.match(/^([1-5])講/);if(m&&!(m[1] in hd))hd[m[1]]=i.x}
    const ks=Object.keys(hd).sort();if(ks.length<4)continue;
    const st=ks.map(k=>hd[k]-3),x0=st[0];
    const ds=its.filter(i=>i.x<x0).map(i=>{const m=i.t.match(/(\d{1,2})月(\d{1,2})日/);return m&&{y:i.y,mo:+m[1],da:+m[2]}}).filter(Boolean).sort((a,b)=>a.y-b.y);
    ds.forEach((d,i)=>{
      const gp=ds[1]?(i?d.y-ds[i-1].y:ds[1].y-d.y):12;
      const lo=i?(ds[i-1].y+d.y)/2:d.y-gp/2,hi=i<ds.length-1?(d.y+ds[i+1].y)/2:d.y+gp/2;
      const row=its.filter(t=>t.y>=lo&&t.y<hi&&t.x>=x0);
      st.forEach((sx,k)=>{
        const ex=k+1<st.length?st[k+1]:1e9;
        const cell=row.filter(t=>t.x>=sx&&t.x<ex).sort((a,b)=>Math.round(a.y)-Math.round(b.y)||a.x-b.x);
        if(!cell.length)return;
        const c=cell.find(t=>/^\(\d+\)$/.test(t.t));
        let sj,n='',rest='';
        if(c){sj=cell.filter(t=>t!==c&&t.x<c.x-.5).map(t=>t.t).join('');n=c.t.slice(1,-1);rest=cell.filter(t=>t.x>c.x+.5).map(t=>t.t).join('')}
        else sj=cell.map(t=>t.t).join('');
        const fm=rest.match(/登校|ライブ|オンデマンド/);
        const room=rest.replace(/登校|ライブ|オンデマンド|選択必修|必修|選択|合同|k\d+/g,'');
        if(!sj)return;
        out.push([((Y||new Date().getFullYear())+(d.mo<4?1:0))+'-'+p(d.mo)+'-'+p(d.da),+ks[k]-1,sj,n,fm?{'登校':'c','ライブ':'l','オンデマンド':'o'}[fm[0]]:'',room]);
      });
    });
  }
  return out;
}
function v3(){
  const custom=!!jl('tt-base',null),en=Object.keys(ED).length;
  $('v3').innerHTML=`<div class="det"><h2>時間割PDFを更新</h2><div class="mu">新しい時間割PDF（今と同じ形式の表）を選ぶと、ブラウザの中で読み取ります。ファイルは外部に送信されません。</div><div class="acts"><input type="file" id="pf" accept="application/pdf"></div><div id="pm" style="margin-top:8px"></div></div><div class="det"><h2>いまのデータ</h2>${custom?'読み込んだPDF':'標準（2026年度後期 検査技術学専攻1年）'}：${BASE.length}コマ<br>手動の変更：${en}件<div class="acts"><button id="rb" ${custom?'':'disabled'}>標準に戻す</button><button id="re" ${en?'':'disabled'}>手動の変更をすべて消す</button></div></div>`;
  $('rb').onclick=()=>{try{localStorage.removeItem('tt-base')}catch(e){}build();render();show();v3()};
  $('re').onclick=()=>{ED={};js('tt-edits',ED);build();render();show();v3()};
  $('pf').onchange=async e=>{
    const f=e.target.files[0],pm=$('pm');if(!f)return;
    if(!window.pdfjsLib){pm.textContent='PDF読み取り用の部品を読み込めませんでした。ネット接続を確認してください。';return}
    pm.textContent='読み取り中…';
    try{
      const rows=await parsePdf(await f.arrayBuffer());
      if(!rows.length){pm.textContent='授業を読み取れませんでした。今の時間割と同じ形式のPDFか確認してください。';return}
      const ds=rows.map(r=>r[0]).sort(),names=[...new Set(rows.map(r=>r[2]))];
      pm.innerHTML=`${rows.length}コマを読み取りました（${md(ds[0])}〜${md(ds[ds.length-1])}）<br><span class="mu">${names.map(esc).join(' / ')}</span><div class="acts"><button id="ap" class="pri">この内容に置き換える</button></div>`;
      $('ap').onclick=()=>{js('tt-base',rows);build();cur=monday(new Date());sel=null;render();show();v3();$('pm').textContent='置き換えました。手動の変更は残っています。'};
    }catch(err){pm.textContent='読み取りに失敗しました：'+err.message}
  };
}
function setTab(n){
  [1,2,3].forEach(i=>{$('v'+i).hidden=i!==n;$('t'+i).className=i===n?'on':''});
